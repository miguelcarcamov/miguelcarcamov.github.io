    description: 'Minor release. The optimizers are right where it mattered most:
      FISTA and MFISTA accelerate again

      (they ran as ISTA, #400) on a current gradient (#401) and take only proximal
      line searches (#179);

      the ROW gradient follows the intensity model (#423); the regularizers keep the
      parameter''s

      precision (#431); the restoring beam''s position angle is no longer 90 degrees
      off (#427). The

      command-line scrip'
  - name: v3.3.0 - simulations match CASA, primary beams at CASA's radius
    tag: v3.3.0
    published_at: '2026-10-28T21:38:04.346Z'
    url: https://gitlab.com/clirai/pyralysis/-/releases/v3.3.0
    description: 'Minor release. Simulated Measurement Sets match CASA: ITRF antenna
      positions with the right Up sign, TIME stamps at the sidereal rate, UVW in the
      J2000 frame of the phase centre (within about 2e-6 of CASA 6.7), the configuration''s
      `TELESCOPE_NAME` and CASA''s observatory positions (#385-#391). Polynomial primary
      beams are evaluated at CASA''s radius, and the VLA gets CASA''s blocked Airy
      beam (#398).'
